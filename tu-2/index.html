<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>TU-2 · Vibes</title>
    <meta name="application-name" content="TU-2" />
    <meta
      name="description"
      content="A chromatic guitar and bass tuner in the style of a classic stompbox. Tap the pedal, play a string and chase the LEDs until they stop."
    />
    <meta name="keywords" content="music, audio, tuner" />
    <meta name="theme-color" content="#14151a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.mjs"></script>
    <script type="module" src="../version.mjs"></script>
  </head>
  <body>
    <main class="stage">
      <div class="pedal" id="pedal" data-power="off">
        <span class="thumbscrew" aria-hidden="true"></span>
        <span class="base" aria-hidden="true"></span>
        <span class="jack jack-l" aria-hidden="true"></span>
        <span class="jack jack-r" aria-hidden="true"></span>

        <!-- Display panel: 91 × 57 units; the keys sit over the SVG. Layout
             traced from the reference photo (1120 × 700 px ≈ 12.3 px/unit). -->
        <div class="panel">
          <svg
            class="panel-art"
            viewBox="0 0 91 57"
            role="img"
            aria-label="Tuner display"
          >
            <defs>
              <!-- Halos: pre-built gradients, opacity follows --b. -->
              <radialGradient id="glow-red">
                <stop offset="0" stop-color="#ff3a22" stop-opacity="0.8" />
                <stop offset="0.35" stop-color="#ff2a1a" stop-opacity="0.38" />
                <stop offset="1" stop-color="#ff2a1a" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="glow-green">
                <stop offset="0" stop-color="#3dff6a" stop-opacity="0.8" />
                <stop offset="0.35" stop-color="#3dff6a" stop-opacity="0.38" />
                <stop offset="1" stop-color="#3dff6a" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="glow-amber">
                <stop offset="0" stop-color="#ffc21a" stop-opacity="0.75" />
                <stop offset="0.35" stop-color="#ffb400" stop-opacity="0.32" />
                <stop offset="1" stop-color="#ffb400" stop-opacity="0" />
              </radialGradient>
              <!-- Glass beads: unlit, lit and the hot core. -->
              <radialGradient id="bead-off-red" cx="0.42" cy="0.38" r="0.75">
                <stop offset="0" stop-color="#8f241b" />
                <stop offset="0.6" stop-color="#43100c" />
                <stop offset="1" stop-color="#170403" />
              </radialGradient>
              <radialGradient id="bead-off-pale" cx="0.42" cy="0.38" r="0.75">
                <stop offset="0" stop-color="#f4f3ee" />
                <stop offset="0.7" stop-color="#c3c4c0" />
                <stop offset="1" stop-color="#85878a" />
              </radialGradient>
              <radialGradient id="bead-on-red" cx="0.45" cy="0.4" r="0.7">
                <stop offset="0" stop-color="#ff9c84" />
                <stop offset="0.45" stop-color="#ff3a22" />
                <stop offset="1" stop-color="#b8160a" />
              </radialGradient>
              <radialGradient id="bead-on-green" cx="0.45" cy="0.4" r="0.7">
                <stop offset="0" stop-color="#d8ffe2" />
                <stop offset="0.45" stop-color="#44ff72" />
                <stop offset="1" stop-color="#0f9a35" />
              </radialGradient>
              <radialGradient id="hot-red">
                <stop offset="0" stop-color="#fff4ee" />
                <stop offset="0.5" stop-color="#ffc4b4" stop-opacity="0.8" />
                <stop offset="1" stop-color="#ff8a70" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="hot-green">
                <stop offset="0" stop-color="#f6fff8" />
                <stop offset="0.5" stop-color="#c4ffd2" stop-opacity="0.8" />
                <stop offset="1" stop-color="#7cff9a" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="seg-h" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ff9a86" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff0ea" />
                <stop offset="1" stop-color="#ff9a86" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="seg-v" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ff9a86" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff0ea" />
                <stop offset="1" stop-color="#ff9a86" stop-opacity="0" />
              </linearGradient>
              <radialGradient id="spec">
                <stop offset="0" stop-color="#fff" stop-opacity="0.9" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="tri-amber" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffd24a" />
                <stop offset="1" stop-color="#ff9d00" />
              </linearGradient>
              <radialGradient id="screw" cx="0.4" cy="0.35" r="0.8">
                <stop offset="0" stop-color="#3c3d42" />
                <stop offset="1" stop-color="#050506" />
              </radialGradient>
              <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#14137a" />
                <stop offset="1" stop-color="#0b0a52" />
              </linearGradient>
              <!-- A lowercase-b style flat, 1 unit tall, baseline at y = 0. -->
              <path
                id="flat"
                d="M0 -1V0M0 -0.52C0.34 -0.66 0.68 -0.48 0.68 -0.26C0.68 -0.02 0.32 0.05 0 -0.08"
              />
            </defs>

            <rect width="91" height="57" rx="1.6" fill="#08080a" />

            <g class="screws">
              <g transform="translate(9.1 8.9)">
                <circle r="4.1" />
                <circle class="socket" r="2.5" />
                <path d="M-1.3-0.75 0-1.5 1.3-0.75V0.75L0 1.5-1.3 0.75Z" />
              </g>
              <g transform="translate(81.3 8.1)">
                <circle r="4.1" />
                <circle class="socket" r="2.5" />
                <path d="M-1.3-0.75 0-1.5 1.3-0.75V0.75L0 1.5-1.3 0.75Z" />
              </g>
              <g transform="translate(6.9 49.3)">
                <circle r="4.1" />
                <circle class="socket" r="2.5" />
                <path d="M-1.3-0.75 0-1.5 1.3-0.75V0.75L0 1.5-1.3 0.75Z" />
              </g>
              <g transform="translate(85 49.2)">
                <circle r="4.1" />
                <circle class="socket" r="2.5" />
                <path d="M-1.3-0.75 0-1.5 1.3-0.75V0.75L0 1.5-1.3 0.75Z" />
              </g>
            </g>

            <!-- Top row: flat (▶), CHECK, sharp (◀). The lamps are built by display.mjs. -->
            <g data-tri="flat" data-shape="20.2,6.9 20.2,11.3 26,9.1"></g>
            <g data-tri="sharp" data-shape="70.8,6.9 70.8,11.3 65,9.1"></g>
            <g data-check></g>
            <text
              class="silk"
              x="48.7"
              y="7.9"
              textLength="11.4"
              lengthAdjust="spacingAndGlyphs"
            >
              CHECK
            </text>
            <text class="silk" x="45.4" y="12.4" text-anchor="middle">0</text>

            <!-- LED arc, light-pipe and ticks are built by display.mjs. -->
            <g data-arc></g>

            <!-- Bracket: the thin line under the ticks, round CHROMATIC to MODE. -->
            <path
              class="bracket"
              d="M11.4 32.2Q38.6 18.6 66 26.1Q76 29.4 81 34.2Q82.6 36.2 80.6 37.2H74.6"
            />

            <!-- Flats (upright, slightly slanted) and mode names. -->
            <g class="flats">
              <use href="#flat" transform="translate(14.3 34.7) scale(1.9)" />
              <use href="#flat" transform="translate(15.65 34.7) scale(1.9)" />
              <use href="#flat" transform="translate(19.1 32.7) scale(1.9)" />
              <use href="#flat" transform="translate(37.8 27.6) scale(1.9)" />
              <use href="#flat" transform="translate(39.15 27.6) scale(1.9)" />
              <use href="#flat" transform="translate(45 26.9) scale(1.9)" />
            </g>
            <text
              class="silk"
              transform="translate(22.1 31.2) rotate(-12)"
              textLength="8.7"
              lengthAdjust="spacingAndGlyphs"
            >
              BASS
            </text>
            <text
              class="silk"
              transform="translate(48 27.4) rotate(5)"
              textLength="11.4"
              lengthAdjust="spacingAndGlyphs"
            >
              GUITAR
            </text>
            <path
              id="chroma-path"
              fill="none"
              d="M62.6 29.9Q73 30.6 79.8 36.2"
            />
            <text class="silk">
              <textPath
                href="#chroma-path"
                textLength="18"
                lengthAdjust="spacingAndGlyphs"
              >
                CHROMATIC
              </textPath>
            </text>

            <text
              class="silk"
              x="4"
              y="21.9"
              textLength="4.5"
              lengthAdjust="spacingAndGlyphs"
            >
              -50
            </text>
            <text
              class="silk"
              x="81.5"
              y="21.9"
              textLength="5.1"
              lengthAdjust="spacingAndGlyphs"
            >
              +50
            </text>

            <!-- Bottom row. -->
            <text
              class="silk"
              x="10.8"
              y="38"
              textLength="22.8"
              lengthAdjust="spacingAndGlyphs"
            >
              STREAM/CENT
            </text>
            <text
              class="silk"
              x="64.5"
              y="37.9"
              textLength="9.1"
              lengthAdjust="spacingAndGlyphs"
            >
              MODE
            </text>
            <rect
              x="38.5"
              y="29.4"
              width="14.4"
              height="19.1"
              rx="0.3"
              fill="url(#glass)"
              stroke="#000"
              stroke-width="0.3"
            />
            <svg
              class="digit"
              x="39.7"
              y="30.3"
              width="11.9"
              height="17.4"
              viewBox="0 0 96 144"
              data-digit
            ></svg>
            <rect
              class="silk-fill"
              x="54"
              y="47.25"
              width="2.1"
              height="0.55"
            />
            <path
              class="ind"
              data-sharp
              d="M57.8 45.6 57.2 48.8M59.1 45.6 58.5 48.8M56.4 46.6H60M56.2 48H59.8"
            />

            <path class="pitch-line" d="M24.1 52.4H38.2M52.8 52.4H67" />
            <polygon
              class="silk-fill"
              points="20.7,50.9 23.4,50.9 22.05,54.1"
            />
            <polygon class="silk-fill" points="67.5,54.1 70.3,54.1 68.9,50.9" />
            <text
              class="silk"
              x="39.15"
              y="53.7"
              font-size="4.7"
              textLength="12.6"
              lengthAdjust="spacingAndGlyphs"
            >
              PITCH
            </text>
          </svg>

          <button
            type="button"
            class="key key-style"
            id="style-btn"
            aria-label="Stream or cent display. Hold to lower the reference pitch."
          ></button>
          <button
            type="button"
            class="key key-mode"
            id="mode-btn"
            aria-label="Mode. Hold to raise the reference pitch."
          ></button>
        </div>

        <!-- Everything below the panel is the hinged hood; the pad stomps. -->
        <div class="hood" id="hood">
          <span class="lip-shadow" aria-hidden="true"></span>
          <svg class="body-silk" viewBox="0 61 100 116" aria-hidden="true">
            <defs>
              <!-- Left-pointing stroked arrow, tip at the origin, 7.4 × 6 units. -->
              <path id="arrow" d="M7.4 0H0.6M3.5 -3L0.6 0 3.5 3" />
            </defs>
            <g class="arrow">
              <use href="#arrow" transform="translate(4.8 70.8)" />
              <use href="#arrow" transform="translate(4.8 79.8)" />
              <use href="#arrow" transform="translate(88.6 70.8)" />
            </g>
            <g class="silk-body">
              <text x="14.2" y="72.8" font-size="5.6" textLength="25">
                OUTPUT
              </text>
              <text x="14.2" y="81.8" font-size="5.6" textLength="23.5">
                BYPASS
              </text>
              <text x="64.5" y="72.8" font-size="5.6" textLength="22">
                INPUT
              </text>
              <text
                class="big"
                x="10"
                y="94.2"
                font-size="12.6"
                textLength="75"
                lengthAdjust="spacingAndGlyphs"
              >
                Chromatic
              </text>
              <text
                class="big"
                x="46.5"
                y="108.4"
                font-size="12.6"
                textLength="43.5"
                lengthAdjust="spacingAndGlyphs"
              >
                Tuner
              </text>
              <text
                x="70.5"
                y="117.6"
                font-size="6.6"
                font-weight="600"
                textLength="19.5"
              >
                TU-2
              </text>
            </g>
          </svg>

          <button
            type="button"
            class="footswitch"
            id="stomp"
            aria-pressed="false"
            aria-label="Tuner on or off"
          >
            <svg viewBox="0 0 90 52" aria-hidden="true">
              <g class="emboss">
                <rect x="11" y="8" width="11" height="10" rx="1.6" />
                <path d="M14.2 11.6 16.5 15.4 18.8 11.6" />
                <text
                  x="26"
                  y="17.4"
                  textLength="53"
                  lengthAdjust="spacingAndGlyphs"
                >
                  VIBES
                </text>
              </g>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <p class="under">
      <span id="hint">Tap to tune</span><span id="readout"></span>
    </p>
    <p id="note" class="note" role="alert" hidden></p>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

    <footer class="site-footer">
      <a href="../">← Vibes</a>
      <span>Audio stays on your device.</span>
      <span><a data-version hidden></a></span>
    </footer>
  </body>
</html>
