<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df9ff" />
      <stop offset="1" stop-color="#ff5cf0" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0b0820" />
  <g fill="url(#ink)">
    <!-- A crab-style invader, one unit = 4px. -->
    <rect x="12" y="12" width="4" height="4" />
    <rect x="48" y="12" width="4" height="4" />
    <rect x="16" y="16" width="4" height="4" />
    <rect x="44" y="16" width="4" height="4" />
    <rect x="16" y="20" width="32" height="4" />
    <rect x="12" y="24" width="8" height="4" />
    <rect x="28" y="24" width="8" height="4" />
    <rect x="44" y="24" width="8" height="4" />
    <rect x="8" y="28" width="48" height="8" />
    <rect x="8" y="36" width="4" height="8" />
    <rect x="16" y="36" width="32" height="4" />
    <rect x="52" y="36" width="4" height="8" />
    <rect x="16" y="40" width="4" height="4" />
    <rect x="44" y="40" width="4" height="4" />
  </g>
  <!-- eyes -->
  <rect x="20" y="28" width="8" height="8" fill="#0b0820" />
  <rect x="36" y="28" width="8" height="8" fill="#0b0820" />
  <rect x="22" y="30" width="4" height="4" fill="#fff" />
  <rect x="38" y="30" width="4" height="4" fill="#fff" />
  <!-- ink drips -->
  <g fill="#ff5cf0">
    <rect x="20" y="44" width="4" height="8" />
    <rect x="20" y="52" width="4" height="4" rx="2" />
    <rect x="34" y="40" width="4" height="14" />
    <rect x="34" y="54" width="4" height="4" rx="2" />
    <rect x="48" y="44" width="4" height="6" />
  </g>
</svg>
