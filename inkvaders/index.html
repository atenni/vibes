<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Inkvaders · Vibes</title>
    <meta name="application-name" content="Inkvaders" />
    <meta
      name="description"
      content="Space Invaders for thumbs. Slide to steer, draw neon ink in the sky, and ricochet the invaders' own bullets back at them."
    />
    <meta name="keywords" content="game, arcade" />
    <meta name="theme-color" content="#0b0820" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.mjs"></script>
    <script type="module" src="../version.mjs"></script>
  </head>
  <body data-screen="title">
    <!-- Reads the safe-area insets into computed padding so the canvas HUD can avoid notches. -->
    <div id="safe" aria-hidden="true"></div>
    <canvas id="game" aria-label="Inkvaders playfield"></canvas>

    <button
      id="pause-btn"
      class="pause"
      type="button"
      aria-label="Pause"
      hidden
    >
      <span></span><span></span>
    </button>

    <section id="title" class="overlay overlay-bottom" aria-label="Inkvaders">
      <h1 class="visually-hidden">Inkvaders</h1>
      <div class="panel">
        <ul class="tips">
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 17h18M6 14l-3 3 3 3M18 14l3 3-3 3" class="s-cyan" />
              <rect x="9" y="5" width="6" height="7" rx="1" class="f-cyan" />
            </svg>
            <span
              ><b>Slide in the dock</b> to steer. You fire automatically.</span
            >
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 18C8 4 10 22 14 10s5-3 7-6" class="s-pink" />
            </svg>
            <span><b>Draw in the sky.</b> Ink bounces bullets back.</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21V9M7 13l5-5 5 5" class="s-yellow" />
              <circle cx="12" cy="4" r="3" class="f-yellow" />
            </svg>
            <span><b>Ink full?</b> Flick up for an Ink Bomb.</span>
          </li>
        </ul>
        <button id="play-btn" class="big" type="button">Tap to play</button>
        <div class="row">
          <p class="best">Best <output id="best-title">0</output></p>
          <div class="toggles">
            <button
              type="button"
              class="toggle"
              data-toggle="sound"
              aria-pressed="true"
              aria-label="Sound"
              title="Sound"
            >
              <svg viewBox="0 0 12 12" aria-hidden="true">
                <path
                  class="glyph"
                  transform="translate(-0.5 0)"
                  d="M4 1h8v2h-8zM4 3h1v6h-1zM11 3h1v5h-1zM2 8h3v1h-3zM1 9h4v1h-4zM1 10h3v1h-3zM9 7h3v1h-3zM8 8h4v1h-4zM8 9h3v1h-3z"
                />
                <path
                  class="slash"
                  d="M0 0h2v1h-2zM1 1h2v1h-2zM2 2h2v1h-2zM3 3h2v1h-2zM4 4h2v1h-2zM5 5h2v1h-2zM6 6h2v1h-2zM7 7h2v1h-2zM8 8h2v1h-2zM9 9h2v1h-2zM10 10h2v1h-2z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="toggle"
              data-toggle="haptics"
              aria-pressed="true"
              aria-label="Haptics"
              title="Haptics"
            >
              <svg viewBox="0 0 12 12" aria-hidden="true">
                <path
                  class="glyph"
                  d="M4 1h4v1h-4zM4 10h4v1h-4zM4 2h1v8h-1zM7 2h1v8h-1zM5 8h2v1h-2zM2 3h1v2h-1zM1 5h1v2h-1zM2 7h1v2h-1zM9 3h1v2h-1zM10 5h1v2h-1zM9 7h1v2h-1z"
                />
                <path
                  class="slash"
                  d="M0 0h2v1h-2zM1 1h2v1h-2zM2 2h2v1h-2zM3 3h2v1h-2zM4 4h2v1h-2zM5 5h2v1h-2zM6 6h2v1h-2zM7 7h2v1h-2zM8 8h2v1h-2zM9 9h2v1h-2zM10 10h2v1h-2z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section
      id="pause"
      class="overlay overlay-centre"
      aria-label="Paused"
      hidden
    >
      <div class="card">
        <h2>Paused</h2>
        <p class="sub">Tap to resume</p>
        <button id="resume-btn" class="big" type="button">Resume</button>
        <button id="restart-btn" class="secondary" type="button">
          Restart
        </button>
        <div class="toggles">
          <button
            type="button"
            class="toggle"
            data-toggle="sound"
            aria-pressed="true"
            aria-label="Sound"
            title="Sound"
          >
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                class="glyph"
                transform="translate(-0.5 0)"
                d="M4 1h8v2h-8zM4 3h1v6h-1zM11 3h1v5h-1zM2 8h3v1h-3zM1 9h4v1h-4zM1 10h3v1h-3zM9 7h3v1h-3zM8 8h4v1h-4zM8 9h3v1h-3z"
              />
              <path
                class="slash"
                d="M0 0h2v1h-2zM1 1h2v1h-2zM2 2h2v1h-2zM3 3h2v1h-2zM4 4h2v1h-2zM5 5h2v1h-2zM6 6h2v1h-2zM7 7h2v1h-2zM8 8h2v1h-2zM9 9h2v1h-2zM10 10h2v1h-2z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="toggle"
            data-toggle="haptics"
            aria-pressed="true"
            aria-label="Haptics"
            title="Haptics"
          >
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                class="glyph"
                d="M4 1h4v1h-4zM4 10h4v1h-4zM4 2h1v8h-1zM7 2h1v8h-1zM5 8h2v1h-2zM2 3h1v2h-1zM1 5h1v2h-1zM2 7h1v2h-1zM9 3h1v2h-1zM10 5h1v2h-1zM9 7h1v2h-1z"
              />
              <path
                class="slash"
                d="M0 0h2v1h-2zM1 1h2v1h-2zM2 2h2v1h-2zM3 3h2v1h-2zM4 4h2v1h-2zM5 5h2v1h-2zM6 6h2v1h-2zM7 7h2v1h-2zM8 8h2v1h-2zM9 9h2v1h-2zM10 10h2v1h-2z"
              />
            </svg>
          </button>
        </div>
        <button id="quit-btn" class="link" type="button">Quit to title</button>
      </div>
    </section>

    <section
      id="over"
      class="overlay overlay-centre"
      aria-label="Game over"
      hidden
    >
      <div class="card">
        <h2>Game over</h2>
        <p id="new-best" class="new-best" hidden>New best!</p>
        <dl class="stats">
          <div class="score">
            <dt>Score</dt>
            <dd id="over-score">0</dd>
          </div>
          <div>
            <dt>Wave</dt>
            <dd id="over-wave">1</dd>
          </div>
          <div>
            <dt>Best combo</dt>
            <dd id="over-combo">×1</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="over-best">0</dd>
          </div>
        </dl>
        <button id="again-btn" class="big" type="button">Again</button>
        <div class="row-buttons">
          <button id="share-btn" class="secondary" type="button">Share</button>
          <button id="title-btn" class="secondary" type="button">Title</button>
        </div>
      </div>
    </section>

    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

    <footer class="site-footer">
      <a href="../">← Vibes</a>
      <span>Inkvaders</span>
      <span><a data-version hidden></a></span>
    </footer>
  </body>
</html>
